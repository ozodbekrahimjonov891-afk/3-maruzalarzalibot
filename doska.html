<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interaktiv Doska</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@700&display=swap');

:root {
  --bg:      #f7f0e3;
  --surface: #fffaf2;
  --card:    #fffcf5;
  --border:  rgba(139,94,26,0.2);
  --gold:    #8b5e1a;
  --gold2:   #c9972b;
  --gold3:   #e8b84b;
  --text:    #3d2008;
  --muted:   #8b7355;
  --radius:  14px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }

/* ── FON NAQSHI ── */
body::before {
  content: '';
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' stroke='%238b5e1a' stroke-width='0.5' opacity='0.07'%3E%3Crect x='5' y='5' width='50' height='50' rx='2'/%3E%3Crect x='12' y='12' width='36' height='36' rx='1' transform='rotate(45 30 30)'/%3E%3Ccircle cx='30' cy='30' r='5'/%3E%3C/g%3E%3C/svg%3E");
  background-size: 60px 60px;
}

/* ── HEADER ── */
header {
  position: sticky; top: 0; z-index: 100;
  background: rgba(247,240,227,0.95);
  border-bottom: 1px solid rgba(139,94,26,0.25);
  backdrop-filter: blur(12px);
  padding: 0 40px;
  display: flex; align-items: center; justify-content: space-between;
  height: 68px;
}
header::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, transparent, var(--gold2), var(--gold3), var(--gold2), transparent);
}
header::after {
  content: '';
  position: absolute; bottom: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(139,94,26,0.3), transparent);
}

.logo { display: flex; align-items: center; gap: 12px; }
.logo-icon {
  width: 42px; height: 42px; border-radius: 10px;
  background: linear-gradient(135deg, var(--gold), var(--gold2));
  display: flex; align-items: center; justify-content: center; font-size: 20px;
  box-shadow: 0 2px 12px rgba(139,94,26,0.25);
}
.logo-text h1 {
  font-family: 'Playfair Display', serif;
  font-size: 19px; font-weight: 700; color: var(--text);
}
.logo-text p { font-size: 11px; color: var(--muted); margin-top: 1px; }

.live-badge {
  display: flex; align-items: center; gap: 5px;
  background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.3);
  border-radius: 20px; padding: 4px 10px; font-size: 11px; color: #166534;
}
.dot { width: 7px; height: 7px; border-radius: 50%; background: #22c55e; animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(.7)} }

.clock-time { font-size: 26px; font-weight: 300; color: var(--gold); letter-spacing: 2px; font-variant-numeric: tabular-nums; }
.clock-date { font-size: 11px; color: var(--muted); text-align: right; margin-top: 1px; }

/* ── BURCHAK BEZAKLARI ── */
.corner-deco {
  position: fixed; pointer-events: none; z-index: 0;
  width: 100px; height: 100px;
}
.corner-deco.tl { top: 68px; left: 0; }
.corner-deco.tr { top: 68px; right: 0; transform: scaleX(-1); }
.corner-deco.bl { bottom: 0; left: 0; transform: scaleY(-1); }
.corner-deco.br { bottom: 0; right: 0; transform: scale(-1); }

/* ── ORNAMENT ── */
.ornament {
  display: flex; align-items: center; gap: 12px;
  padding: 24px 40px 16px; position: relative; z-index: 1;
}
.ornament-line { flex: 1; height: 1px; background: linear-gradient(90deg, transparent, rgba(139,94,26,0.3), transparent); }
.ornament-title {
  display: flex; align-items: center; gap: 8px;
  font-size: 11px; font-weight: 600; letter-spacing: 2px;
  text-transform: uppercase; color: var(--gold);
}
.gem { width: 7px; height: 7px; background: var(--gold2); transform: rotate(45deg); border-radius: 1px; }

/* ── HOME ── */
#home-wrap { padding: 0 40px 40px; position: relative; z-index: 1; }

.teacher-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 18px;
}

.teacher-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 26px 18px 20px;
  text-align: center;
  cursor: pointer;
  position: relative; overflow: hidden;
  transition: transform .22s, box-shadow .22s, border-color .22s;
}
.teacher-card::before { content:''; position:absolute; top:8px; left:8px; width:18px; height:18px; border-top:1.5px solid rgba(139,94,26,0.3); border-left:1.5px solid rgba(139,94,26,0.3); }
.teacher-card::after  { content:''; position:absolute; bottom:8px; right:8px; width:18px; height:18px; border-bottom:1.5px solid rgba(139,94,26,0.3); border-right:1.5px solid rgba(139,94,26,0.3); }
.teacher-card:hover {
  transform: translateY(-3px);
  border-color: rgba(201,151,43,0.5);
  box-shadow: 0 8px 28px rgba(139,94,26,0.12);
}

.t-ring {
  width: 70px; height: 70px; border-radius: 50%; margin: 0 auto 14px;
  padding: 2.5px;
  background: linear-gradient(135deg, var(--gold), var(--gold3));
}
.t-inner {
  width: 100%; height: 100%; border-radius: 50%;
  background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  font-size: 24px; font-weight: 700; color: var(--gold);
  overflow: hidden;
}
.t-inner img { width:100%; height:100%; object-fit:cover; display:block; }

.t-name { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
.t-count { font-size: 12px; color: var(--muted); }
.new-dot { width: 8px; height: 8px; border-radius: 50%; background: #ef4444; display: inline-block; margin-left: 5px; vertical-align: middle; }

.empty-home { text-align: center; padding: 70px 20px; color: var(--muted); grid-column: 1/-1; }
.empty-home .icon { font-size: 48px; margin-bottom: 12px; }

/* ── CHAT ── */
#chat { display: none; position: relative; z-index: 1; }

.chat-header {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 40px;
  background: rgba(247,240,227,0.95);
  border-bottom: 1px solid rgba(139,94,26,0.2);
  position: sticky; top: 68px; z-index: 90;
  backdrop-filter: blur(10px);
}
.back-btn {
  background: rgba(139,94,26,0.07); border: 1px solid rgba(139,94,26,0.25);
  color: var(--gold); padding: 7px 14px; border-radius: 8px;
  cursor: pointer; font-size: 13px; transition: background .2s;
}
.back-btn:hover { background: rgba(139,94,26,0.14); }

.c-ring { width: 44px; height: 44px; border-radius: 50%; padding: 2px; background: linear-gradient(135deg, var(--gold), var(--gold3)); flex-shrink: 0; }
.c-inner { width:100%; height:100%; border-radius:50%; background:var(--bg); display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:700; color:var(--gold); overflow:hidden; }
.c-inner img { width:100%; height:100%; object-fit:cover; display:block; }
.chat-name { font-size: 15px; font-weight: 600; color: var(--text); }

.messages { padding: 22px 40px; display: flex; flex-direction: column; gap: 16px; }

/* ── MSG ── */
.msg {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px 18px;
  max-width: 840px;
  position: relative;
}
.msg::before {
  content: '';
  position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px;
  background: linear-gradient(180deg, var(--gold), var(--gold3));
  border-radius: 3px 0 0 3px;
}
.msg-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.msg-time { font-size: 11px; color: var(--muted); }
.msg-type { font-size: 11px; padding: 2px 9px; border-radius: 20px; font-weight: 500; }
.type-text  { background: rgba(34,197,94,.1);  color: #166534; }
.type-image { background: rgba(139,94,26,.1);  color: var(--gold); }
.type-video { background: rgba(217,119,6,.1);  color: #92400e; }
.type-file  { background: rgba(180,83,9,.1);   color: #78350f; }
.type-voice { background: rgba(159,122,234,.1);color: #5b21b6; }
.new-badge { background: #ef4444; color: #fff; font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 20px; margin-left: 7px; }
.msg-text { font-size: 14px; line-height: 1.7; color: rgba(61,32,8,.85); white-space: pre-wrap; }

.msg-img-wrap { margin-top: 10px; cursor: zoom-in; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); }
.msg-img-wrap img { width:100%; display:block; max-height:420px; object-fit:contain; background:#f5ece0; }
.zoom-hint { font-size: 11px; color: var(--muted); margin-top: 4px; }

.msg-video-wrap { margin-top: 10px; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); background: #1a0a00; }
.msg-video-wrap video { width:100%; display:block; max-height:460px; }

.file-row { display:flex; align-items:center; gap:10px; padding:10px 14px; margin-top:10px; background:rgba(139,94,26,0.05); border:1px solid rgba(139,94,26,0.2); border-radius:8px; }
.file-name { font-size:13px; font-weight:500; flex:1; word-break:break-all; color:var(--text); }
.file-dl { font-size:11px; color:var(--gold); text-decoration:none; padding:4px 10px; border:1px solid rgba(139,94,26,0.3); border-radius:20px; white-space:nowrap; }
.file-dl:hover { background:rgba(139,94,26,0.1); }

.empty-chat { text-align:center; padding:60px 20px; color:var(--muted); }

/* ── LIGHTBOX ── */
#lightbox { display:none; position:fixed; inset:0; background:rgba(0,0,0,.9); z-index:1000; align-items:center; justify-content:center; cursor:zoom-out; }
#lightbox.open { display:flex; }
#lightbox img { max-width:95vw; max-height:95vh; object-fit:contain; border-radius:8px; }
#lb-close { position:fixed; top:18px; right:22px; color:#e8b84b; font-size:28px; cursor:pointer; }

/* ── FEEDBACK ── */
.fb-btn {
  position:fixed; bottom:26px; right:26px; z-index:200;
  background:linear-gradient(135deg, var(--gold), var(--gold2));
  color:#fff; border:none; border-radius:50px;
  padding:11px 20px; font-size:13px; font-weight:600; cursor:pointer;
  box-shadow:0 4px 20px rgba(139,94,26,0.35); transition:transform .2s;
}
.fb-btn:hover { transform:scale(1.04); }

.fb-modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:300; align-items:center; justify-content:center; }
.fb-modal.open { display:flex; }
.fb-box {
  background:var(--card); border:1px solid rgba(139,94,26,0.3); border-radius:16px;
  padding:28px; width:400px; max-width:92vw; position:relative;
}
.fb-box::before { content:''; position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg,transparent,var(--gold2),transparent); border-radius:16px 16px 0 0; }
.fb-box h3 { font-family:'Playfair Display',serif; font-size:17px; color:var(--text); margin-bottom:5px; }
.fb-box p  { font-size:12px; color:var(--muted); margin-bottom:14px; }
.fb-box textarea { width:100%; background:rgba(139,94,26,0.04); border:1px solid rgba(139,94,26,0.2); border-radius:8px; color:var(--text); padding:11px 13px; font-size:13px; font-family:inherit; resize:vertical; min-height:100px; outline:none; }
.fb-box textarea:focus { border-color:var(--gold2); }
.fb-actions { display:flex; gap:8px; margin-top:12px; justify-content:flex-end; }
.btn-cancel { background:none; border:1px solid var(--border); color:var(--muted); padding:8px 16px; border-radius:8px; cursor:pointer; font-size:12px; }
.btn-send { background:linear-gradient(135deg,var(--gold),var(--gold2)); border:none; color:#fff; padding:8px 18px; border-radius:8px; cursor:pointer; font-size:12px; font-weight:600; }
.fb-ok { text-align:center; padding:18px 0; }
.fb-ok .icon { font-size:38px; margin-bottom:8px; }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">🏛️</div>
    <div class="logo-text">
      <h1>Interaktiv Doska</h1>

    </div>

<script>
function tick(){
  const n=new Date();
  document.getElementById('clock').textContent=n.toLocaleTimeString('uz-UZ',{hour12:false});
  const D=['Yakshanba','Dushanba','Seshanba','Chorshanba','Payshanba','Juma','Shanba'];
  const M=['yanvar','fevral','mart','aprel','may','iyun','iyul','avgust','sentabr','oktabr','noyabr','dekabr'];
  document.getElementById('clock-date').textContent=`${D[n.getDay()]}, ${n.getDate()} ${M[n.getMonth()]} ${n.getFullYear()}`;
}
tick(); setInterval(tick,1000);

let data={teachers:{},materials:[]};
let currentT=null;
let seen=new Set();

function tAv(name,photo,big){
  const s=big?70:44;
  const cls=big?'t-ring':'c-ring';
  const icls=big?'t-inner':'c-inner';
  const fs=big?24:16;
  const init=name.charAt(0).toUpperCase();
  return `<div class="${cls}" style="width:${s}px;height:${s}px"><div class="${icls}" style="font-size:${fs}px">${photo?`<img src="${photo}" onerror="this.outerHTML='${init}'">`:`${init}`}</div></div>`;
}

function fIcon(n=''){
  const e=(n.split('.').pop()||'').toLowerCase();
  if(e==='pdf')return'📄';
  if(['ppt','pptx'].includes(e))return'📊';
  if(['doc','docx'].includes(e))return'📝';
  if(['xls','xlsx'].includes(e))return'📈';
  if(['zip','rar'].includes(e))return'🗜️';
  return'📎';
}
function tLabel(t){return{text:'📝 Matn',image:'🖼️ Rasm',video:'🎬 Video',file:'📎 Fayl',voice:'🎙️ Ovoz'}[t]||t;}

function renderHome(){
  const grid=document.getElementById('teacher-grid');
  const ts=data.teachers||{};
  const ms=data.materials||[];
  if(!Object.keys(ts).length){
    grid.innerHTML=`<div class="empty-home"><div class="icon">👨‍🏫</div><p>Hali ustozlar yo'q</p></div>`;
    return;
  }
  grid.innerHTML=Object.entries(ts).map(([tid,t])=>{
    const cnt=ms.filter(m=>m.teacher_id===tid).length;
    const hasNew=ms.some(m=>m.teacher_id===tid&&!seen.has(m.id));
    return`<div class="teacher-card" onclick="openChat('${tid}')">
      ${tAv(t.name,t.photo,true)}
      <div class="t-name">${t.name}${hasNew?'<span class="new-dot"></span>':''}</div>
      <div class="t-count">📚 ${cnt} ta material</div>
    </div>`;
  }).join('');
}

function openChat(tid){
  currentT=tid;
  const t=data.teachers[tid]; if(!t)return;
  document.getElementById('chat-av').innerHTML=tAv(t.name,t.photo,false);
  document.getElementById('chat-name').textContent=t.name;
  renderMsgs(tid);
  document.getElementById('home').style.display='none';
  document.getElementById('chat').style.display='block';
}

function renderMsgs(tid){
  const ms=(data.materials||[]).filter(m=>m.teacher_id===tid);
  const box=document.getElementById('messages');
  if(!ms.length){box.innerHTML=`<div class="empty-chat">📭 Hali material yuborilmagan</div>`;return;}
  box.innerHTML=ms.map(m=>{
    const isNew=!seen.has(m.id); seen.add(m.id);
    let body='';
    if(m.type==='text'){
      body=`<div class="msg-text">${m.content.replace(/</g,'&lt;')}</div>`;
    }else if(m.type==='image'&&m.file_url){
      const c=m.content?`<div class="msg-text" style="margin-bottom:8px">${m.content.replace(/</g,'&lt;')}</div>`:'';
      body=`${c}<div class="msg-img-wrap" onclick="openLb('${m.file_url}')"><img src="${m.file_url}" loading="lazy"></div><div class="zoom-hint">🔍 Kattalashtirish uchun bosing</div>`;
    }else if(m.type==='video'&&m.file_url){
      const c=m.content?`<div class="msg-text" style="margin-bottom:8px">${m.content.replace(/</g,'&lt;')}</div>`:'';
      body=`${c}<div class="msg-video-wrap"><video controls playsinline preload="metadata"><source src="${m.file_url}" type="video/mp4"><source src="${m.file_url}"></video></div>`;
    }else if(m.type==='file'&&m.file_url){
      const c=m.content?`<div class="msg-text" style="margin-bottom:8px">${m.content.replace(/</g,'&lt;')}</div>`:'';
      body=`${c}<div class="file-row"><span style="font-size:20px">${fIcon(m.file_name)}</span><span class="file-name">${m.file_name||'fayl'}</span><a class="file-dl" href="${m.file_url}" target="_blank" download>⬇ Yuklab olish</a></div>`;
    }else if(m.type==='voice'&&m.file_url){
      body=`<audio src="${m.file_url}" controls preload="metadata" style="width:100%;margin-top:8px"></audio>`;
    }
    return`<div class="msg">
      <div class="msg-header">
        <div><span class="msg-type type-${m.type}">${tLabel(m.type)}</span>${isNew?'<span class="new-badge">YANGI</span>':''}</div>
        <span class="msg-time">🕐 ${m.time}</span>
      </div>${body}</div>`;
  }).join('');
}

function goHome(){
  currentT=null;
  document.querySelectorAll('video').forEach(v=>v.pause());
  document.getElementById('chat').style.display='none';
  document.getElementById('home').style.display='block';
  renderHome();
}

function openLb(url){document.getElementById('lb-img').src=url;document.getElementById('lightbox').classList.add('open');document.body.style.overflow='hidden';}
function closeLb(){document.getElementById('lightbox').classList.remove('open');document.getElementById('lb-img').src='';document.body.style.overflow='';}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeLb();closeFb();}});

async function fetchData(){
  try{
    const r=await fetch('/materials.json?t='+Date.now());
    data=await r.json();
    if(currentT)renderMsgs(currentT); else renderHome();
  }catch(e){}
}
fetchData(); setInterval(fetchData,5000);

function openFb(){document.getElementById('fb-form').style.display='block';document.getElementById('fb-ok').style.display='none';document.getElementById('fb-text').value='';document.getElementById('fb-modal').classList.add('open');}
function closeFb(){document.getElementById('fb-modal').classList.remove('open');}
async function sendFb(){
  const t=document.getElementById('fb-text').value.trim(); if(!t)return;
  try{await fetch('/feedback',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:t})});}catch(e){}
  document.getElementById('fb-form').style.display='none';
  document.getElementById('fb-ok').style.display='block';
  setTimeout(closeFb,2000);
}
</script>
</body>
</html>

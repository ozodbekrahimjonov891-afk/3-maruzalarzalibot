<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interaktiv Doska</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
  :root {
    --bg: #050d1a; --surface: #0a1628; --card: #0f1f36;
    --border: #1a3155; --accent: #1a6eff; --accent2: #00cfff;
    --text: #e8f0fe; --muted: #6b8ab5; --radius: 14px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 40px; background: var(--surface);
    border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100;
  }
  .logo { display: flex; align-items: center; gap: 12px; }
  .logo-icon { width: 40px; height: 40px; background: linear-gradient(135deg, var(--accent), var(--accent2)); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
  .logo-text h1 { font-size: 18px; font-weight: 700; }
  .logo-text p  { font-size: 11px; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; animation: pulse 2s infinite; display: inline-block; margin-right: 6px; }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.5;transform:scale(.8)} }
  .clock-time { font-size: 26px; font-weight: 300; letter-spacing: 2px; color: var(--accent2); font-variant-numeric: tabular-nums; }
  .clock-date { font-size: 11px; color: var(--muted); text-align: right; }

  /* HOME */
  #home { padding: 40px; }
  .home-title { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 1.2px; margin-bottom: 24px; font-weight: 500; }
  .teacher-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
  .teacher-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 28px 20px; text-align: center; cursor: pointer; transition: transform .2s, border-color .2s; }
  .teacher-card:hover { transform: translateY(-3px); border-color: var(--accent); }
  .t-avatar-wrap { width: 72px; height: 72px; border-radius: 50%; margin: 0 auto 14px; overflow: hidden; border: 3px solid var(--accent); }
  .t-avatar-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .t-initials { width: 72px; height: 72px; border-radius: 50%; margin: 0 auto 14px; background: linear-gradient(135deg, var(--accent), var(--accent2)); display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 700; border: 3px solid var(--accent); }
  .teacher-name { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
  .teacher-count { font-size: 12px; color: var(--muted); }
  .new-dot { width: 10px; height: 10px; border-radius: 50%; background: #ff4b4b; display: inline-block; margin-left: 6px; vertical-align: middle; }
  .empty-home { text-align: center; padding: 80px 20px; color: var(--muted); }
  .empty-home .icon { font-size: 52px; margin-bottom: 14px; }

  /* CHAT */
  #chat { display: none; }
  .chat-header { display: flex; align-items: center; gap: 14px; padding: 16px 40px; background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 65px; z-index: 90; }
  .back-btn { background: none; border: 1px solid var(--border); color: var(--text); padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; transition: border-color .2s; }
  .back-btn:hover { border-color: var(--accent); }
  .c-avatar-wrap { width: 42px; height: 42px; border-radius: 50%; overflow: hidden; border: 2px solid var(--accent); flex-shrink: 0; }
  .c-avatar-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .c-initials { width: 42px; height: 42px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--accent2)); display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700; border: 2px solid var(--accent); flex-shrink: 0; }
  .chat-teacher-name { font-size: 16px; font-weight: 600; }
  .messages { padding: 24px 40px; display: flex; flex-direction: column; gap: 16px; }

  /* MESSAGE */
  .msg { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; max-width: 820px; }
  .msg-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .msg-time { font-size: 11px; color: var(--muted); }
  .msg-type { font-size: 11px; padding: 2px 8px; border-radius: 20px; }
  .type-text  { background: rgba(34,197,94,.12);  color: #22c55e; }
  .type-image { background: rgba(168,85,247,.12); color: #a855f7; }
  .type-video { background: rgba(249,115,22,.12); color: #f97316; }
  .type-file  { background: rgba(234,179,8,.12);  color: #eab308; }
  .type-voice { background: rgba(236,72,153,.12); color: #ec4899; }
  .msg-text { font-size: 14px; line-height: 1.65; color: rgba(232,240,254,.9); white-space: pre-wrap; }
  .new-badge { background: #ff4b4b; color: #fff; font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 20px; margin-left: 8px; }
  .empty-chat { text-align: center; padding: 60px 20px; color: var(--muted); }

  /* IMAGE — clickable */
  .msg-img-wrap { margin-top: 10px; cursor: zoom-in; border-radius: 8px; overflow: hidden; background: var(--surface); }
  .msg-img-wrap img { width: 100%; display: block; max-height: 400px; object-fit: contain; transition: opacity .2s; }
  .msg-img-wrap:hover img { opacity: .9; }

  /* VIDEO */
  .msg-video-wrap { margin-top: 10px; border-radius: 8px; overflow: hidden; background: #000; position: relative; }
  .msg-video-wrap video { width: 100%; display: block; max-height: 480px; background: #000; }

  /* FILE */
  .file-row { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--surface); border-radius: 8px; margin-top: 10px; border: 1px solid var(--border); }
  .file-name { font-size: 13px; font-weight: 500; flex: 1; word-break: break-all; }
  .file-dl { font-size: 11px; color: var(--accent); text-decoration: none; padding: 4px 10px; border: 1px solid var(--accent); border-radius: 20px; white-space: nowrap; }
  .file-dl:hover { background: var(--accent); color: #fff; }

  /* LIGHTBOX */
  #lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.92); z-index: 1000; align-items: center; justify-content: center; cursor: zoom-out; }
  #lightbox.open { display: flex; }
  #lightbox img { max-width: 95vw; max-height: 95vh; object-fit: contain; border-radius: 8px; box-shadow: 0 0 60px rgba(0,0,0,.8); }
  #lightbox-close { position: fixed; top: 20px; right: 24px; color: #fff; font-size: 32px; cursor: pointer; line-height: 1; opacity: .8; }
  #lightbox-close:hover { opacity: 1; }

  /* FEEDBACK */
  .feedback-btn { position: fixed; bottom: 28px; right: 28px; background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; border: none; border-radius: 50px; padding: 12px 22px; font-size: 13px; font-weight: 600; cursor: pointer; z-index: 200; box-shadow: 0 4px 20px rgba(26,110,255,.4); transition: transform .2s; }
  .feedback-btn:hover { transform: scale(1.05); }
  .feedback-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 300; align-items: center; justify-content: center; }
  .feedback-modal.open { display: flex; }
  .feedback-box { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 28px; width: 420px; max-width: 90vw; }
  .feedback-box h3 { font-size: 17px; font-weight: 600; margin-bottom: 6px; }
  .feedback-box p  { font-size: 13px; color: var(--muted); margin-bottom: 16px; }
  .feedback-box textarea { width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; color: var(--text); padding: 12px; font-size: 14px; font-family: inherit; resize: vertical; min-height: 110px; outline: none; }
  .feedback-box textarea:focus { border-color: var(--accent); }
  .feedback-actions { display: flex; gap: 10px; margin-top: 14px; justify-content: flex-end; }
  .btn-cancel { background: none; border: 1px solid var(--border); color: var(--muted); padding: 9px 18px; border-radius: 8px; cursor: pointer; font-size: 13px; }
  .btn-send { background: var(--accent); border: none; color: #fff; padding: 9px 20px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; }
  .btn-send:hover { background: #1558d4; }
  .feedback-success { text-align: center; padding: 20px 0; }
  .feedback-success .icon { font-size: 42px; margin-bottom: 10px; }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">📋</div>
    <div class="logo-text">
      <h1>Interaktiv Doska</h1>
      <p><span class="dot"></span>Jonli</p>
    </div>
  </div>
  <div style="text-align:right">
    <div class="clock-time" id="clock">00:00:00</div>
    <div class="clock-date" id="clock-date"></div>
  </div>
</header>

<!-- HOME -->
<div id="home">
  <div style="padding:40px">
    <div class="home-title">Ustozlar</div>
    <div class="teacher-grid" id="teacher-grid">
      <div class="empty-home"><div class="icon">👨‍🏫</div><p>Hali ustozlar yo'q</p></div>
    </div>
  </div>
</div>

<!-- CHAT -->
<div id="chat">
  <div class="chat-header">
    <button class="back-btn" onclick="goHome()">← Orqaga</button>
    <div id="chat-avatar"></div>
    <div class="chat-teacher-name" id="chat-name"></div>
  </div>
  <div class="messages" id="messages"></div>
</div>

<!-- LIGHTBOX -->
<div id="lightbox" onclick="closeLightbox()">
  <span id="lightbox-close">✕</span>
  <img id="lightbox-img" src="" alt="">
</div>

<!-- FEEDBACK -->
<button class="feedback-btn" onclick="openFeedback()">💬 Fikr bildirish</button>
<div class="feedback-modal" id="feedback-modal">
  <div class="feedback-box">
    <div id="fb-form">
      <h3>Fikr bildirish</h3>
      <p>Kamchilik yoki takliflaringizni yozing</p>
      <textarea id="fb-text" placeholder="Yozing..."></textarea>
      <div class="feedback-actions">
        <button class="btn-cancel" onclick="closeFeedback()">Bekor</button>
        <button class="btn-send" onclick="sendFeedback()">Yuborish</button>
      </div>
    </div>
    <div id="fb-success" class="feedback-success" style="display:none">
      <div class="icon">✅</div>
      <p>Fikringiz qabul qilindi!</p>
    </div>
  </div>
</div>

<script>
  // Clock
  function updateClock() {
    const now = new Date();
    document.getElementById('clock').textContent = now.toLocaleTimeString('uz-UZ',{hour12:false});
    const days=['Yakshanba','Dushanba','Seshanba','Chorshanba','Payshanba','Juma','Shanba'];
    const months=['yanvar','fevral','mart','aprel','may','iyun','iyul','avgust','sentabr','oktabr','noyabr','dekabr'];
    document.getElementById('clock-date').textContent=`${days[now.getDay()]}, ${now.getDate()} ${months[now.getMonth()]} ${now.getFullYear()}`;
  }
  updateClock(); setInterval(updateClock,1000);

  let allData={teachers:{},materials:[]};
  let currentTeacher=null;
  let seenIds=new Set();

  function makeAvatar(name,photo,big){
    const s=big?72:42;
    if(photo){
      return `<div class="${big?'t-avatar-wrap':'c-avatar-wrap'}" style="width:${s}px;height:${s}px"><img src="${photo}" onerror="this.parentElement.innerHTML='<div style=\'width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:${big?26:17}px;font-weight:700\'>${name.charAt(0).toUpperCase()}</div>'"></div>`;
    }
    return `<div class="${big?'t-initials':'c-initials'}" style="width:${s}px;height:${s}px;font-size:${big?26:17}px">${name.charAt(0).toUpperCase()}</div>`;
  }

  function fileIcon(n=''){
    const e=(n.split('.').pop()||'').toLowerCase();
    if(e==='pdf')return'📄';
    if(['ppt','pptx'].includes(e))return'📊';
    if(['doc','docx'].includes(e))return'📝';
    if(['xls','xlsx'].includes(e))return'📈';
    if(['zip','rar','7z'].includes(e))return'🗜️';
    return'📎';
  }

  function typeLabel(t){
    return{text:'📝 Matn',image:'🖼️ Rasm',video:'🎬 Video',file:'📎 Fayl',voice:'🎙️ Ovoz'}[t]||t;
  }

  function renderHome(){
    const grid=document.getElementById('teacher-grid');
    const teachers=allData.teachers||{};
    const materials=allData.materials||[];
    if(!Object.keys(teachers).length){
      grid.innerHTML=`<div class="empty-home"><div class="icon">👨‍🏫</div><p>Hali ustozlar yo'q</p></div>`;
      return;
    }
    grid.innerHTML=Object.entries(teachers).map(([tid,t])=>{
      const count=materials.filter(m=>m.teacher_id===tid).length;
      const hasNew=materials.some(m=>m.teacher_id===tid&&!seenIds.has(m.id));
      return`<div class="teacher-card" onclick="openChat('${tid}')">
        ${makeAvatar(t.name,t.photo,true)}
        <div class="teacher-name">${t.name}${hasNew?'<span class="new-dot"></span>':''}</div>
        <div class="teacher-count">${count} ta material</div>
      </div>`;
    }).join('');
  }

  function openChat(tid){
    currentTeacher=tid;
    const t=allData.teachers[tid];
    if(!t)return;
    document.getElementById('chat-avatar').innerHTML=makeAvatar(t.name,t.photo,false);
    document.getElementById('chat-name').textContent=t.name;
    renderMessages(tid);
    document.getElementById('home').style.display='none';
    document.getElementById('chat').style.display='block';
  }

  function renderMessages(tid){
    const msgs=(allData.materials||[]).filter(m=>m.teacher_id===tid);
    const box=document.getElementById('messages');
    if(!msgs.length){
      box.innerHTML=`<div class="empty-chat">📭 Hali material yuborilmagan</div>`;
      return;
    }
    box.innerHTML=msgs.map(m=>{
      const isNew=!seenIds.has(m.id);
      seenIds.add(m.id);
      let content='';
      if(m.type==='text'){
        content=`<div class="msg-text">${m.content.replace(/</g,'&lt;')}</div>`;
      } else if(m.type==='image'&&m.file_url){
        const cap=m.content?`<div class="msg-text" style="margin-bottom:8px">${m.content.replace(/</g,'&lt;')}</div>`:'';
        content=`${cap}<div class="msg-img-wrap" onclick="openLightbox('${m.file_url}')">
          <img src="${m.file_url}" loading="lazy" title="Kattalashtirish uchun bosing">
        </div><div style="font-size:11px;color:var(--muted);margin-top:5px;text-align:right">🔍 Kattalashtirish uchun bosing</div>`;
      } else if(m.type==='video'&&m.file_url){
        const cap=m.content?`<div class="msg-text" style="margin-bottom:8px">${m.content.replace(/</g,'&lt;')}</div>`:'';
        content=`${cap}<div class="msg-video-wrap">
          <video controls playsinline preload="metadata" style="width:100%;max-height:480px;background:#000">
            <source src="${m.file_url}" type="video/mp4">
            <source src="${m.file_url}">
          </video>
        </div>`;
      } else if(m.type==='file'&&m.file_url){
        const cap=m.content?`<div class="msg-text" style="margin-bottom:8px">${m.content.replace(/</g,'&lt;')}</div>`:'';
        content=`${cap}<div class="file-row">
          <span style="font-size:22px">${fileIcon(m.file_name)}</span>
          <span class="file-name">${m.file_name||'fayl'}</span>
          <a class="file-dl" href="${m.file_url}" target="_blank" download>⬇ Yuklab olish</a>
        </div>`;
      } else if(m.type==='voice'&&m.file_url){
        content=`<audio src="${m.file_url}" controls preload="metadata" style="width:100%;margin-top:8px"></audio>`;
      }
      return`<div class="msg">
        <div class="msg-header">
          <div><span class="msg-type type-${m.type}">${typeLabel(m.type)}</span>${isNew?'<span class="new-badge">YANGI</span>':''}</div>
          <span class="msg-time">🕐 ${m.time}</span>
        </div>
        ${content}
      </div>`;
    }).join('');
  }

  function goHome(){
    currentTeacher=null;
    // Pause all videos
    document.querySelectorAll('video').forEach(v=>v.pause());
    document.getElementById('chat').style.display='none';
    document.getElementById('home').style.display='block';
    renderHome();
  }

  // Lightbox
  function openLightbox(url){
    document.getElementById('lightbox-img').src=url;
    document.getElementById('lightbox').classList.add('open');
    document.body.style.overflow='hidden';
  }
  function closeLightbox(){
    document.getElementById('lightbox').classList.remove('open');
    document.getElementById('lightbox-img').src='';
    document.body.style.overflow='';
  }
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLightbox();});

  async function fetchData(){
    try{
      const res=await fetch('/materials.json?t='+Date.now());
      allData=await res.json();
      if(currentTeacher)renderMessages(currentTeacher);
      else renderHome();
    }catch(e){}
  }
  fetchData();
  setInterval(fetchData,5000);

  // Feedback
  function openFeedback(){
    document.getElementById('fb-form').style.display='block';
    document.getElementById('fb-success').style.display='none';
    document.getElementById('fb-text').value='';
    document.getElementById('feedback-modal').classList.add('open');
  }
  function closeFeedback(){document.getElementById('feedback-modal').classList.remove('open');}
  async function sendFeedback(){
    const text=document.getElementById('fb-text').value.trim();
    if(!text)return;
    try{await fetch('/feedback',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});}catch(e){}
    document.getElementById('fb-form').style.display='none';
    document.getElementById('fb-success').style.display='block';
    setTimeout(closeFeedback,2000);
  }
</script>
</body>
</html>

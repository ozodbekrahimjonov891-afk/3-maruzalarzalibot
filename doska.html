<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interaktiv Doska</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

  :root {
    --bg:        #050d1a;
    --surface:   #0a1628;
    --card:      #0f1f36;
    --border:    #1a3155;
    --accent:    #1a6eff;
    --accent2:   #00cfff;
    --text:      #e8f0fe;
    --muted:     #6b8ab5;
    --new-badge: #ff4b4b;
    --radius:    14px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── HEADER ── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 40px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(12px);
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .logo-icon {
    width: 42px; height: 42px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
  }

  .logo-text h1 {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.3px;
  }

  .logo-text p {
    font-size: 12px;
    color: var(--muted);
    font-weight: 400;
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 24px;
  }

  .clock {
    text-align: right;
  }

  .clock-time {
    font-size: 28px;
    font-weight: 300;
    letter-spacing: 2px;
    font-variant-numeric: tabular-nums;
    color: var(--accent2);
  }

  .clock-date {
    font-size: 12px;
    color: var(--muted);
  }

  .refresh-indicator {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--muted);
  }

  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #22c55e;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%       { opacity: .5; transform: scale(.8); }
  }

  /* ── GRID ── */
  main {
    padding: 32px 40px 40px;
  }

  .section-title {
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1.2px;
    margin-bottom: 20px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
    gap: 20px;
  }

  /* ── CARD ── */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    position: relative;
    transition: transform .2s, border-color .2s;
  }

  .card:hover {
    transform: translateY(-2px);
    border-color: var(--accent);
  }

  .card.is-new {
    border-color: rgba(26,110,255,.5);
    box-shadow: 0 0 24px rgba(26,110,255,.12);
  }

  /* NEW badge */
  .badge-new {
    position: absolute;
    top: 14px; right: 14px;
    background: var(--new-badge);
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 20px;
    letter-spacing: .8px;
    animation: badgePop .4s cubic-bezier(.34,1.56,.64,1);
  }

  @keyframes badgePop {
    from { transform: scale(0); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
  }

  /* Card header */
  .card-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
  }

  .avatar {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    font-weight: 700;
    flex-shrink: 0;
  }

  .card-meta h3 {
    font-size: 15px;
    font-weight: 600;
  }

  .card-meta-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 3px;
  }

  .subject-tag {
    font-size: 11px;
    font-weight: 500;
    padding: 2px 8px;
    background: rgba(26,110,255,.15);
    color: var(--accent2);
    border-radius: 20px;
  }

  .time-tag {
    font-size: 11px;
    color: var(--muted);
  }

  /* Type badge */
  .type-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    font-weight: 500;
    padding: 3px 10px;
    border-radius: 20px;
    margin-bottom: 10px;
  }

  .type-text  { background: rgba(34,197,94,.12);  color: #22c55e; }
  .type-image { background: rgba(168,85,247,.12); color: #a855f7; }
  .type-video { background: rgba(249,115,22,.12); color: #f97316; }
  .type-file  { background: rgba(234,179,8,.12);  color: #eab308; }
  .type-voice { background: rgba(236,72,153,.12); color: #ec4899; }

  /* Content */
  .card-content {
    font-size: 14px;
    line-height: 1.65;
    color: rgba(232,240,254,.85);
  }

  .card-content.text-content {
    max-height: 120px;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 5;
    -webkit-box-orient: vertical;
  }

  /* Media */
  .media-wrap {
    margin-top: 12px;
    border-radius: 8px;
    overflow: hidden;
    background: var(--surface);
  }

  .media-wrap img,
  .media-wrap video {
    width: 100%;
    display: block;
    max-height: 220px;
    object-fit: cover;
  }

  /* File row */
  .file-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    background: var(--surface);
    border-radius: 8px;
    margin-top: 10px;
    border: 1px solid var(--border);
  }

  .file-icon { font-size: 22px; }
  .file-name { font-size: 13px; font-weight: 500; color: var(--text); }
  .file-link {
    margin-left: auto;
    font-size: 11px;
    color: var(--accent);
    text-decoration: none;
    padding: 4px 10px;
    border: 1px solid var(--accent);
    border-radius: 20px;
  }
  .file-link:hover { background: var(--accent); color: #fff; }

  /* Empty state */
  .empty-state {
    text-align: center;
    padding: 80px 20px;
    color: var(--muted);
  }

  .empty-state .icon { font-size: 56px; margin-bottom: 16px; }
  .empty-state h2 { font-size: 20px; font-weight: 500; margin-bottom: 8px; }
  .empty-state p  { font-size: 14px; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">📋</div>
    <div class="logo-text">
      <h1>Interaktiv Doska</h1>
      <p>Ustozlar materiali — real vaqt</p>
    </div>
  </div>
  <div class="header-right">
    <div class="refresh-indicator">
      <div class="dot"></div>
      <span id="refresh-label">Yangilanmoqda…</span>
    </div>
    <div class="clock">
      <div class="clock-time" id="clock">00:00:00</div>
      <div class="clock-date" id="clock-date"></div>
    </div>
  </div>
</header>

<main>
  <div class="section-title">Oxirgi materiallar</div>
  <div class="grid" id="grid">
    <div class="empty-state">
      <div class="icon">📭</div>
      <h2>Hali material yo'q</h2>
      <p>Ustozlar Telegram botga material yuborishsa, bu yerda ko'rinadi.</p>
    </div>
  </div>
</main>

<script>
  // ── Clock ──
  function updateClock() {
    const now = new Date();
    document.getElementById('clock').textContent =
      now.toLocaleTimeString('uz-UZ', { hour12: false });
    const days = ['Yakshanba','Dushanba','Seshanba','Chorshanba','Payshanba','Juma','Shanba'];
    const months = ['yanvar','fevral','mart','aprel','may','iyun','iyul','avgust','sentabr','oktabr','noyabr','dekabr'];
    document.getElementById('clock-date').textContent =
      `${days[now.getDay()]}, ${now.getDate()} ${months[now.getMonth()]} ${now.getFullYear()}`;
  }
  updateClock();
  setInterval(updateClock, 1000);

  // ── Type metadata ──
  const TYPE_META = {
    text:  { label: 'Matn',         icon: '📝', cls: 'type-text'  },
    image: { label: 'Rasm',         icon: '🖼️',  cls: 'type-image' },
    video: { label: 'Video',        icon: '🎬', cls: 'type-video' },
    file:  { label: 'Fayl',         icon: '📎', cls: 'type-file'  },
    voice: { label: 'Ovozli xabar', icon: '🎙️', cls: 'type-voice' },
  };

  function fileIcon(name = '') {
    const ext = name.split('.').pop().toLowerCase();
    if (['pdf'].includes(ext)) return '📄';
    if (['ppt','pptx'].includes(ext)) return '📊';
    if (['doc','docx'].includes(ext)) return '📝';
    if (['xls','xlsx'].includes(ext)) return '📈';
    if (['zip','rar','7z'].includes(ext)) return '🗜️';
    return '📎';
  }

  function avatarChar(name) {
    return name ? name.charAt(0).toUpperCase() : '?';
  }

  function buildCard(m) {
    const meta = TYPE_META[m.type] || TYPE_META.text;
    const isNew = m.is_new;

    let mediaHTML = '';
    if (m.type === 'image' && m.file_url) {
      mediaHTML = `<div class="media-wrap"><img src="${m.file_url}" alt="rasm" loading="lazy"></div>`;
    } else if (m.type === 'video' && m.file_url) {
      mediaHTML = `<div class="media-wrap"><video src="${m.file_url}" controls playsinline></video></div>`;
    } else if (m.type === 'file' && m.file_url) {
      mediaHTML = `
        <div class="file-row">
          <span class="file-icon">${fileIcon(m.file_name)}</span>
          <span class="file-name">${m.file_name || 'fayl'}</span>
          <a class="file-link" href="${m.file_url}" target="_blank">Yuklab olish</a>
        </div>`;
    } else if (m.type === 'voice' && m.file_url) {
      mediaHTML = `<div class="media-wrap" style="padding:12px"><audio src="${m.file_url}" controls style="width:100%"></audio></div>`;
    }

    const textHTML = m.content
      ? `<div class="card-content text-content">${m.content.replace(/</g,'&lt;').replace(/\n/g,'<br>')}</div>`
      : '';

    return `
      <div class="card${isNew ? ' is-new' : ''}">
        ${isNew ? '<span class="badge-new">YANGI</span>' : ''}
        <div class="card-header">
          <div class="avatar">${avatarChar(m.teacher_name)}</div>
          <div class="card-meta">
            <h3>👨‍🏫 ${m.teacher_name}</h3>
            <div class="card-meta-row">
              <span class="subject-tag">📚 ${m.subject}</span>
              <span class="time-tag">🕐 ${m.time}</span>
            </div>
          </div>
        </div>
        <span class="type-badge ${meta.cls}">${meta.icon} ${meta.label}</span>
        ${textHTML}
        ${mediaHTML}
      </div>`;
  }

  // ── Fetch & render ──
  let knownIds = new Set();

  async function fetchMaterials() {
    try {
      const res = await fetch('/materials.json?t=' + Date.now());
      const list = await res.json();

      // Detect truly new items
      const newOnes = list.filter(m => !knownIds.has(m.id));
      newOnes.forEach(m => knownIds.add(m.id));

      const grid = document.getElementById('grid');

      if (!list.length) {
        grid.innerHTML = `
          <div class="empty-state">
            <div class="icon">📭</div>
            <h2>Hali material yo'q</h2>
            <p>Ustozlar Telegram botga material yuborishsa, bu yerda ko'rinadi.</p>
          </div>`;
        return;
      }

      // Mark new for first 30 s
      const now = Date.now();
      const marked = list.map(m => ({
        ...m,
        is_new: newOnes.some(n => n.id === m.id) && (now - m.id < 30000)
      }));

      grid.innerHTML = marked.map(buildCard).join('');
      document.getElementById('refresh-label').textContent = 'Jonli';
    } catch (e) {
      document.getElementById('refresh-label').textContent = 'Xato — qayta urinilmoqda';
    }
  }

  fetchMaterials();
  setInterval(fetchMaterials, 5000);
</script>
</body>
</html>
